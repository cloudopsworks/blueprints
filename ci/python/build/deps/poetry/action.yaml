name: Build Python Sources with Poetry
author: cloudopsworks
description: Build Python sources with poetry
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  python_extra_env:
    description: 'The extra environment variables'
    required: true
  python_requirements_file:
    description: 'The requirements file'
    required: false
    default: './requirements.txt'
  poetry_spec:
    description: 'The poetry requirement spec to run with uvx'
    required: false
    default: 'poetry==2.5.2'
  poetry_export_spec:
    description: 'The poetry export plugin requirement spec'
    required: false
    default: 'poetry-plugin-export==1.10.2'

runs:
  using: 'composite'
  steps:
    - name: Install Dependencies (Poetry)
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Poetry Install"
        source .venv/bin/activate
        VENV_PY="${PWD}/.venv/bin/python"
        echo "Installing dependencies"
        bash -c "${INPUTS_PYTHON_EXTRA_ENV} uvx --python \"${VENV_PY}\" --from \"${POETRY_SPEC}\" --with \"${POETRY_EXPORT_SPEC}\" poetry install"
        echo "Exporting requirements"
        bash -c "${INPUTS_PYTHON_EXTRA_ENV} uvx --python \"${VENV_PY}\" --from \"${POETRY_SPEC}\" --with \"${POETRY_EXPORT_SPEC}\" poetry export --without-hashes --format=requirements.txt --output \"${INPUTS_PYTHON_REQUIREMENTS_FILE}\""
        echo "::endgroup::"
      env:
        GITHUB_ACTOR: ${{ inputs.bot_user }}
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUTS_PYTHON_EXTRA_ENV: ${{ inputs.python_extra_env }}
        INPUTS_PYTHON_REQUIREMENTS_FILE: ${{ inputs.python_requirements_file }}
        POETRY_SPEC: ${{ inputs.poetry_spec }}
        POETRY_EXPORT_SPEC: ${{ inputs.poetry_export_spec }}
        UV_PYTHON_DOWNLOADS: never
