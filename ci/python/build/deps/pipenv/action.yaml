name: Build Python Sources with Pipenv
author: cloudopsworks
description: Build Python sources with pipenv
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  python_extra_env:
    description: 'The extra environment variables'
    required: true
  python_requirements_file:
    description: 'The requirements file'
    required: false
    default: './requirements.txt'
  pipenv_spec:
    description: 'The pipenv requirement spec to run with uvx'
    required: false
    default: 'pipenv==2026.12.1'

runs:
  using: 'composite'
  steps:
    - name: Install Dependencies (PipEnv)
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Pipenv Install"
        source .venv/bin/activate
        VENV_PY="${PWD}/.venv/bin/python"
        if [ ! -f Pipfile ]; then
          echo "::warning::No Pipfile found in ${INPUTS_SOURCE_PATH}, skipping pipenv install"
        elif [ -f Pipfile.lock ]; then
          echo "Installing dependencies from Pipfile.lock"
          bash -c "${INPUTS_PYTHON_EXTRA_ENV} uvx --python \"${VENV_PY}\" --from \"${PIPENV_SPEC}\" pipenv sync --dev"
        else
          echo "::warning::No Pipfile.lock found, installing from Pipfile (build is not reproducible)"
          bash -c "${INPUTS_PYTHON_EXTRA_ENV} uvx --python \"${VENV_PY}\" --from \"${PIPENV_SPEC}\" pipenv install --dev"
        fi
        echo "::endgroup::"
      env:
        GITHUB_ACTOR: ${{ inputs.bot_user }}
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUTS_PYTHON_EXTRA_ENV: ${{ inputs.python_extra_env }}
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
        PIPENV_SPEC: ${{ inputs.pipenv_spec }}
        PIPENV_VERBOSITY: '-1'
        UV_PYTHON_DOWNLOADS: never
