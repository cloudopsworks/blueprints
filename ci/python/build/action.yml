name: Build Python Sources
author: cloudopsworks
description: Build Python sources and save artifacts, requires ci/config/action.yml
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  artifacts_name:
    description: 'The name of the artifacts to save'
    required: false
    default: 'build_artifacts'
  sources_artifacts_name:
    description: 'The name of the sources to save'
    required: false
    default: 'source_artifacts'
  bot_user:
    description: 'The bot user to use for the build'
    required: true
  token:
    description: 'The github token to use for the build'
    required: true
  has_preview:
    description: 'The preview flag will process only for preview builds'
    required: false
    default: 'false'
  python_extra_env:
    description: 'The extra environment variables'
    required: true
  python_requirements_file:
    description: 'The requirements file'
    required: false
    default: './requirements.txt'

outputs:
  python_version:
    description: 'The Python version to use for the build'
    value: ${{ steps.python_version.outputs.result }}
  python_dist:
    description: 'The Python distribution to use for the build'
    value: ${{ steps.python_dist.outputs.result }}
  python_image_variant:
    description: 'The Python image variant to use for the build'
    value: ${{ steps.python_image_variant.outputs.result }}
  semver:
    description: 'The semver version'
    value: ${{ steps.semver.outputs.result }}
  package_name:
    description: 'The package name'
    value: ${{ steps.package_name.outputs.result }}


runs:
  using: 'composite'
  steps:
    # Get pipeline conf Python version
    - name: Get pipeline Python version
      id: python_version
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq eval ".python.version // \"3.14\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Install Tronador CLI
      uses: cloudopsworks/install-tronador-cli@v1
      with:
        token: ${{ inputs.token }}

    # Get pipeline conf Python dist
    - name: Get pipeline Python dist
      id: python_dist
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq eval ".python.dist // \"pip\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get pipeline conf Python test ruff linter
    - name: Get pipeline Python test ruff linter
      id: python_test_ruff
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq eval ".python.ruff // \"false\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get pipeline conf Python test mypy test
    - name: Get pipeline Python test mypy test
      id: python_test_mypy
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq eval ".python.mypy // \"false\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get pipeline conf java image variant defaults to alpine
    - name: Get pipeline Python image variant
      id: python_image_variant
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".python.image_variant // \"alpine\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get pipeline conf java image variant defaults to alpine
    - name: Get pipeline Python require packing dependencies
      id: python_with_dependencies
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".python.with_dependencies // \"false\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get pipeline conf Python tests tooling: pytest , unittest (pyunit), nose
    - name: Get pipeline Python tests tooling
      id: python_tests
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq eval ".python.tests // \"pytest\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get pipeline conf install dependency extra_args
    - name: Get pipeline Python install dependency extra_args
      id: python_dep_extra_args
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".python.install_extra_args // \"\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Get Package Name from pyproject.toml
    - name: Get package Name
      id: package_name
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq e -oj -r ".project.name" "${INPUTS_SOURCE_PATH}/pyproject.toml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # Setup Python for builds for the version provided
    - name: Setup Python
      id: setup_python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.python_version.outputs.result }}
        cache: ${{ steps.python_dist.outputs.result == 'pip' && 'pip' || '' }}

    # Install uv: build/QA tools run through uv tool envs and overlays without touching the app .venv
    - name: Install uv
      id: setup_uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: "0.13.8"
        enable-cache: auto
        cache-dependency-glob: |
          ${{ inputs.blueprint_path }}/ci/python/build/**/action.y*ml
          ${{ inputs.blueprint_path }}/ci/python/build/scripts/*.sh
        ignore-nothing-to-cache: true
        download-from-astral-mirror: false

    # install basic tools
    - name: Install Basic Python Tools
      id: install_basic_tools
      shell: bash
      run: |
        echo "::group::Install Basic Python Tools"
        python -m pip install --upgrade pip toml-cli
        echo "::endgroup::"

    # Versioning SET
    - name: Version SET
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Python  Version SET"
        tronador project version --allow-network
        #make version
        echo "::endgroup::"
      env:
        GITHUB_ACTOR: ${{ inputs.bot_user }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Version Capture
      working-directory: ${{ inputs.source_path }}
      id: semver
      shell: bash
      run: |
        echo "result=$(cat VERSION)" >> $GITHUB_OUTPUT

    - name: Generate Python Environment
      working-directory: ${{ inputs.source_path }}
      id: python_env
      shell: bash
      run: |
        echo "::group::Python ENV Setup"
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        echo "::endgroup::"

    # Blueprint tool pins, relaxed to the latest compatible version below each tool's Python floor
    - name: Resolve Python tool specs
      id: python_tools
      shell: bash
      env:
        VENV_PY: ${{ github.workspace }}/${{ inputs.source_path }}/.venv/bin/python
      run: |
        PYV=$("$VENV_PY" -I -c 'import sys;print("%d%02d" % sys.version_info[:2])')
        # pick <output-key> <package> <version> <min-python-NNN>
        pick() {
          if [ "$PYV" -ge "$4" ]; then
            echo "$1=$2==$3" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$2 $3 requires Python >= ${4:0:1}.$((10#${4:1})); using latest compatible $2"
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          fi
        }
        pick ruff          ruff                 0.17.6     307
        pick mypy          mypy                 2.4.1      310
        pick pytest        pytest               9.2.0      310
        pick coverage      coverage             7.17.5     311
        pick cyclonedx     cyclonedx-bom        9.0.0      309
        pick pipenv        pipenv               2026.12.1  311
        pick poetry        poetry               2.5.2      310
        pick poetry_export poetry-plugin-export 1.10.2     310
        if [ "$PYV" -ge 310 ]; then
          pick nose pynose 1.5.5 307
        else
          pick nose nose 1.3.7 000
        fi

    # Build the code
    - name: Build PIP
      if: steps.python_dist.outputs.result == 'pip'
      uses: ./bp/ci/python/build/deps/pip
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        python_requirements_file: ${{ inputs.python_requirements_file }}
        python_extra_env: ${{ inputs.python_extra_env }}

    - name: Build PYPENV
      if: steps.python_dist.outputs.result == 'pipenv'
      uses: ./bp/ci/python/build/deps/pipenv
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        python_requirements_file: ${{ inputs.python_requirements_file }}
        python_extra_env: ${{ inputs.python_extra_env }}
        pipenv_spec: ${{ steps.python_tools.outputs.pipenv }}

    - name: Build Poetry
      if: steps.python_dist.outputs.result == 'poetry'
      uses: ./bp/ci/python/build/deps/poetry
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        python_requirements_file: ${{ inputs.python_requirements_file }}
        python_extra_env: ${{ inputs.python_extra_env }}
        poetry_spec: ${{ steps.python_tools.outputs.poetry }}
        poetry_export_spec: ${{ steps.python_tools.outputs.poetry_export }}

    - name: Python Tests - Pytest
      if: steps.python_tests.outputs.result == 'pytest'
      uses: ./bp/ci/python/build/tests/pytest
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        python_requirements_file: ${{ inputs.python_requirements_file }}
        python_extra_env: ${{ inputs.python_extra_env }}
        bot_user: ${{ inputs.bot_user }}
        token: ${{ inputs.token }}
        pytest_spec: ${{ steps.python_tools.outputs.pytest }}
        coverage_spec: ${{ steps.python_tools.outputs.coverage }}

    - name: Python Tests - Unittest / PyUnit
      if: steps.python_tests.outputs.result == 'unittest' || steps.python_tests.outputs.result == 'pyunit'
      uses: ./bp/ci/python/build/tests/unittest
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        python_requirements_file: ${{ inputs.python_requirements_file }}
        python_extra_env: ${{ inputs.python_extra_env }}
        bot_user: ${{ inputs.bot_user }}
        token: ${{ inputs.token }}
        coverage_spec: ${{ steps.python_tools.outputs.coverage }}

    - name: Python Tests - Nose
      if: steps.python_tests.outputs.result == 'nose'
      uses: ./bp/ci/python/build/tests/nose
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        python_requirements_file: ${{ inputs.python_requirements_file }}
        python_extra_env: ${{ inputs.python_extra_env }}
        bot_user: ${{ inputs.bot_user }}
        token: ${{ inputs.token }}
        nose_spec: ${{ steps.python_tools.outputs.nose }}
        coverage_spec: ${{ steps.python_tools.outputs.coverage }}

    - name: Python stubs generation
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Python Sutbs Generation"
        echo "Generating stubs for Ruff & MyPy"
        echo "[]" > ruff_report.json
        echo "" > mypy_report.txt
        echo "::endgroup::"

    - name: Run Ruff Linter
      if: steps.python_test_ruff.outputs.result == 'true'
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Python Linters"
        source .venv/bin/activate
        VENV_PY="$PWD/.venv/bin/python"
        if [ -x .venv/bin/ruff ]; then
          echo "::notice::ruff: using the version installed by the application"
          RUFF=(.venv/bin/ruff)
        else
          RUFF=(uvx --python "$VENV_PY" --from "${RUFF_SPEC}" ruff)
        fi
        rc=0
        "${RUFF[@]}" check --output-file ruff_report.json --output-format json || rc=$?
        echo "::debug::Start Ruff Report"
        cat ruff_report.json; echo
        echo "::debug::End Ruff Report"
        echo "::endgroup::"
        exit $rc
      env:
        GITHUB_ACTOR: ${{ inputs.bot_user }}
        GITHUB_TOKEN: ${{ inputs.token }}
        RUFF_SPEC: ${{ steps.python_tools.outputs.ruff }}
        UV_PYTHON_DOWNLOADS: never

    - name: Run MyPy Test
      if: steps.python_test_mypy.outputs.result == 'true'
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Python MyPy"
        source .venv/bin/activate
        VENV_PY="$PWD/.venv/bin/python"
        case "${PYTHON_TESTS}" in
          pytest) TEST_TOOLS=(pytest="${PYTEST_SPEC}" coverage="${COVERAGE_SPEC}") ;;
          nose)   TEST_TOOLS=(nose="${NOSE_SPEC}" coverage="${COVERAGE_SPEC}") ;;
          *)      TEST_TOOLS=(coverage="${COVERAGE_SPEC}") ;;
        esac
        OVERLAY="${RUNNER_TEMP}/cw-overlay-mypy.txt"
        bash "${GITHUB_ACTION_PATH}/scripts/uv-overlay.sh" "$VENV_PY" "$OVERLAY" mypy="${MYPY_SPEC}" "${TEST_TOOLS[@]}"
        rc=0
        if [ -s "$OVERLAY" ]; then
          uv run --no-project --python "$VENV_PY" --with-requirements "$OVERLAY" -- python -m mypy . > mypy_report.txt || rc=$?
        else
          python -m mypy . > mypy_report.txt || rc=$?
        fi
        echo "::debug::Start MyPy Report"
        cat mypy_report.txt
        echo "::debug::End MyPy Report"
        echo "::endgroup::"
        exit $rc
      env:
        GITHUB_ACTOR: ${{ inputs.bot_user }}
        GITHUB_TOKEN: ${{ inputs.token }}
        PYTHON_TESTS: ${{ steps.python_tests.outputs.result }}
        MYPY_SPEC: ${{ steps.python_tools.outputs.mypy }}
        PYTEST_SPEC: ${{ steps.python_tools.outputs.pytest }}
        COVERAGE_SPEC: ${{ steps.python_tools.outputs.coverage }}
        NOSE_SPEC: ${{ steps.python_tools.outputs.nose }}
        UV_PYTHON_DOWNLOADS: never

    # SBOM generation
    - name: Install CycloneDX
      working-directory: ${{ inputs.source_path }}
      shell: bash
      env:
        CYCLONEDX_SPEC: ${{ steps.python_tools.outputs.cyclonedx }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        echo "::group::Install CycloneDX"
        uvx --python "$PWD/.venv/bin/python" --from "${CYCLONEDX_SPEC}" cyclonedx-py --version
        echo "::endgroup::"

    - name: SBOM Generation for Dtrack
      working-directory: ${{ inputs.source_path }}
      shell: bash
      env:
        STEPS_PYTHON_DIST_RESULT: ${{ steps.python_dist.outputs.result }}
        INPUTS_PYTHON_REQUIREMENTS_FILE: ${{ inputs.python_requirements_file }}
        CYCLONEDX_SPEC: ${{ steps.python_tools.outputs.cyclonedx }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        echo "::group::SBOM Generation for Dtrack"
        VENV_PY="$PWD/.venv/bin/python"
        CDX=(uvx --python "$VENV_PY" --from "${CYCLONEDX_SPEC}" cyclonedx-py)
        case "${STEPS_PYTHON_DIST_RESULT}" in
          pip|poetry)
            "${CDX[@]}" requirements --of xml -o bom.xml "${INPUTS_PYTHON_REQUIREMENTS_FILE}"
            ;;
          pipenv)
            if [ -f Pipfile.lock ]; then
              "${CDX[@]}" pipenv --of xml -o bom.xml
            else
              echo "::warning::Pipfile.lock not found, SBOM generated from .venv"
              "${CDX[@]}" environment --of xml -o bom.xml "$VENV_PY"
            fi
            ;;
          *)
            echo "Unsupported distribution format: ${STEPS_PYTHON_DIST_RESULT}"
            exit 1
            ;;
        esac
        echo "::endgroup::"

    - name: Build Dependency files if they are required
      working-directory: ${{ inputs.source_path }}
      if: steps.python_with_dependencies.outputs.result == 'true'
      shell: bash
      env:
        STEPS_PYTHON_DEP_EXTRA_ARGS_RESULT: ${{ steps.python_dep_extra_args.outputs.result }}
        INPUTS_PYTHON_REQUIREMENTS_FILE: ${{ inputs.python_requirements_file }}
      run: |
        echo "::group::Build Python Dependencies"
        source .venv/bin/activate
        if [ -f "${INPUTS_PYTHON_REQUIREMENTS_FILE}" ]; then
          echo "Building ${INPUTS_PYTHON_REQUIREMENTS_FILE}"
          # shellcheck disable=SC2086 # extra args are intentionally word-split
          pip install ${STEPS_PYTHON_DEP_EXTRA_ARGS_RESULT} --target ./target/ -r "${INPUTS_PYTHON_REQUIREMENTS_FILE}"
        else
          echo "No ${INPUTS_PYTHON_REQUIREMENTS_FILE} found"
        fi
        if [ -d ./target ]; then
          echo "Building python dependencies"
          tar -cf python-dependencies.tar -C ./target . 
        else
          echo "No python dependencies found"
        fi
        echo "::endgroup::"
