name: Build Python Sources with Basic Pip install
author: cloudopsworks
description: Build Python sources with pip install
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  python_extra_env:
    description: 'The extra environment variables'
    required: true
  python_requirements_file:
    description: 'The requirements file'
    required: false
    default: './requirements.txt'
  nose_spec:
    description: 'Pinned requirement spec for nose (used only when the app does not provide it)'
    required: false
    default: 'pynose==1.5.5'
  coverage_spec:
    description: 'Pinned requirement spec for coverage (used only when the app does not provide it)'
    required: false
    default: 'coverage==7.17.5'
  bot_user:
    description: 'The bot user to use for the build'
    required: true
  token:
    description: 'The github token to use for the build'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run Python Tests
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        echo "::group::Python Tests"
        echo "::warning title=nose is deprecated::nose is unmaintained; pynose is used on Python >= 3.10"
        source .venv/bin/activate
        VENV_PY="$PWD/.venv/bin/python"
        OVERLAY="${RUNNER_TEMP}/cw-overlay-tests.txt"
        bash "${GITHUB_ACTION_PATH}/../../scripts/uv-overlay.sh" "$VENV_PY" "$OVERLAY" \
          nose="${NOSE_SPEC}" coverage="${COVERAGE_SPEC}"
        run() {
          if [ -s "$OVERLAY" ]; then
            uv run --no-project --python "$VENV_PY" --with-requirements "$OVERLAY" -- "$@"
          else
            uv run --no-project --python "$VENV_PY" -- "$@"
          fi
        }
        run python -m coverage run --source=. -m nose -w ./__tests__
        run python -m coverage report --omit "__tests__/*"
        run python -m coverage lcov --omit "__tests__/*"
        run python -m coverage xml --omit "__tests__/*"
        run python -m coverage html --omit "__tests__/*"
        echo "::endgroup::"
      env:
        GITHUB_ACTOR: ${{ inputs.bot_user }}
        GITHUB_TOKEN: ${{ inputs.token }}
        NOSE_SPEC: ${{ inputs.nose_spec }}
        COVERAGE_SPEC: ${{ inputs.coverage_spec }}
        UV_PYTHON_DOWNLOADS: never
