name: Save Android SDK Artifacts
author: cloudopsworks
description: Save Android SDK artifacts to the artifacts store
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  artifacts_name:
    description: 'The name of the artifacts to save'
    required: false
    default: 'build_artifacts'
  sources_artifacts_name:
    description: 'The name of the sources to save'
    required: false
    default: 'source_artifacts'
  android_sdk:
    description: 'Android SDK SDK to build and test'
    required: true
  android_destination:
    description: 'Android SDK Destination to build and test'
    required: true
  android_configuration:
    description: 'Android SDK Configuration to build and test'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Normalize Android SDK inputs
      id: android_normalized
      shell: bash
      env:
        INPUTS_ANDROID_SDK: ${{ inputs.android_sdk }}
        INPUTS_ANDROID_DESTINATION: ${{ inputs.android_destination }}
      run: |
        ret=$(echo "${INPUTS_ANDROID_SDK}_${INPUTS_ANDROID_DESTINATION}" | tr ' ,:=/' '-')
        echo "result=$ret" >> $GITHUB_OUTPUT

    # Get Globs from configuration:
    - name: Get Globs
      id: globs
      uses: cloudopsworks/blueprints/ci/common/artifacts/glob@v5.10
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        language: androidsdk
        
    - name: Normalized Android configuration
      id: normalized_configuration
      shell: bash
      env:
        INPUTS_ANDROID_CONFIGURATION: ${{ inputs.android_configuration }}
        STEPS_ZIP_GLOBS_RESULT: ${{ steps.globs.outputs.includes }}
      run: |
        ret=$(echo "${INPUTS_ANDROID_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')
        val=$(echo "${STEPS_ZIP_GLOBS_RESULT}" | sed -e "s|{android_configuration}|$ret|g")
        echo "result<<EOF" >> $GITHUB_OUTPUT
        echo "$val" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # Perform of upload of artfiacts for Android SDK
    - name: Upload Artifacts to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifacts_name }}_${{ steps.android_normalized.outputs.result }}
        path: |
          ${{ steps.normalized_configuration.outputs.result }}
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast
        overwrite: 'true'

    # Perform of upload of sources
    - name: Upload Sources to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}
        path: |
          ${{ inputs.source_path }}/**
          !${{ inputs.source_path }}/build/**
          !${{ inputs.source_path }}/app/build/**
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '3' #mid-fast

    - name: Tar Artifacts target to preserve some configurations
      id: target_artifacts_tar
      working-directory: ${{ inputs.source_path }}/app/build
      shell: bash
      env:
        INPUTS_SOURCES_ARTIFACTS_NAME: ${{ inputs.sources_artifacts_name }}
      run: |
        tar -cf "$RUNNER_TEMP/${INPUTS_SOURCES_ARTIFACTS_NAME}_target.tar" ./
        echo "path=$RUNNER_TEMP/${INPUTS_SOURCES_ARTIFACTS_NAME}_target.tar" >> $GITHUB_OUTPUT

    # Perform of upload of all target artfiacts for Android SDK
    - name: Upload Target Artifacts to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}_target_${{ steps.android_normalized.outputs.result }}
        path: ${{ steps.target_artifacts_tar.outputs.path }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '5' #good
        overwrite: 'true'
