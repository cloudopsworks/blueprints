name: Save NodeJS Artifacts
author: cloudopsworks
description: Save NodeJS Artifacts to the artifacts store
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  artifacts_name:
    description: 'The name of the artifacts to save'
    required: false
    default: 'build_artifacts'
  sources_artifacts_name:
    description: 'The name of the sources to save'
    required: false
    default: 'source_artifacts'

runs:
  using: 'composite'
  steps:
    # Get Globs from configuration:
    - name: Get Globs
      id: globs
      uses: cloudopsworks/blueprints/common/artifacts/glob@5.10
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        language: nodejs

    # Get Globs for TAR from configuration:
    - name: Get Tar Globs
      id: tar_glob
      uses: cloudopsworks/blueprints/common/artifacts/tar-glob@5.10
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        language: nodejs

    # TODO: make this passed by param
    # get from global inputs the setting if it is frontend target
    - name: Get Front-End Setting
      id: front_end
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq e -I=0 ".frontend and true" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # TODO: make this passed by param
    # get from global inputs the path where to find the node build result
    - name: Get Node Build Dir
      id: node_build_dir
      shell: bash
      env:
        INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        RET=$(yq e -I=0 ".node_build_dir // \"build\"" "./${INPUTS_SOURCE_PATH}/.cloudopsworks/vars/inputs-global.yaml")
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    # The problem with NodeJS are the symlinks, so we need first to create a TAR file
    # with including the steps.tar_globs.outputs.includes and excluding the steps.tar_globs.outputs.excludes with -X option
    # -X options needs an input file so we need to create a temporary file
    - name: Create TAR file
      id: tar_file
      working-directory: ${{ inputs.source_path }}
      shell: bash
      env:
        STEPS_TEMP_EXCLUDE_FILE: ${{ steps.tar_glob.outputs.temp_exclude_file }}
        STEPS_ZIP_GLOBS_LINE_RESULT: ${{ steps.tar_glob.outputs.includes }}
      run: |
        TMP_DIR=$(mktemp -d)
        tar -cf $TMP_DIR/node_artifacts.tar --exclude-from=${STEPS_TEMP_EXCLUDE_FILE} --ignore-failed-read --exclude-vcs ${STEPS_ZIP_GLOBS_LINE_RESULT}
        echo "artifact=$TMP_DIR/node_artifacts.tar" >> $GITHUB_OUTPUT

    # Create tarball for target
    - name: Create TAR file for target
      id: tar_file_target
      working-directory: ${{ inputs.source_path }}
      shell: bash
      env:
        STEPS_ZIP_GLOBS_LINE_RESULT: ${{ steps.tar_glob.outputs.includes }}
      run: |
        TMP_DIR=$(mktemp -d)
        TMP_EXCLUDE_FILE=$(mktemp -t exclude_target)
        echo "node_modules*" > ${TMP_EXCLUDE_FILE}
        echo ".git*" >> ${TMP_EXCLUDE_FILE}
        echo "tronador*" >> ${TMP_EXCLUDE_FILE}
        echo ".tronador" >> ${TMP_EXCLUDE_FILE}
        echo ".nyc*" >> ${TMP_EXCLUDE_FILE}
        echo "apifiles*" >> ${TMP_EXCLUDE_FILE}
        tar -cf $TMP_DIR/node_artifacts_target.tar --ignore-failed-read --hard-dereference --exclude-from=${TMP_EXCLUDE_FILE} --exclude-vcs ${STEPS_ZIP_GLOBS_LINE_RESULT} "coverage/*" test-results.xml "*.sarif" bom.xml trivy-report.json
        echo "artifact=$TMP_DIR/node_artifacts_target.tar" >> $GITHUB_OUTPUT

    # Perform of upload of artfiacts only if not front_end
    - name: Upload Artifacts to workflow
      if: ${{ steps.front_end.outputs.result != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifacts_name }}
        path: ${{ steps.tar_file.outputs.artifact }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast
        overwrite: 'true'

    # Perform the node_build packaging right from the build directory
    - name: Upload Build result
      uses: actions/upload-artifact@v7
      if: steps.front_end.outputs.result == 'true'
      with:
        name: ${{ inputs.artifacts_name }}
        path: ${{ inputs.source_path }}/${{ steps.node_build_dir.outputs.result }}/**
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast
        overwrite: 'true'

    # Perform of upload of sources
    - name: Upload Sources to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}
        path: |
          ${{ inputs.source_path }}/**
          !${{ inputs.source_path }}/${{ steps.node_build_dir.outputs.result }}/**
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast

    # Perform of upload of tar into workflow as target
    - name: Upload tarball of target to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}_target
        path: ${{ steps.tar_file_target.outputs.artifact }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast
        overwrite: 'true'
