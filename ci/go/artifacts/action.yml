name: Save GoLang Artifacts
author: cloudopsworks
description: Save GoLang artifacts to the artifacts store
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  artifacts_name:
    description: 'The name of the artifacts to save'
    required: false
    default: 'build_artifacts'
  sources_artifacts_name:
    description: 'The name of the sources to save'
    required: false
    default: 'source_artifacts'

runs:
  using: 'composite'
  steps:
    # Get Globs from configuration:
    - name: Get Globs
      id: globs
      uses: cloudopsworks/blueprints/ci/common/artifacts/glob@v5.10
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        language: golang

    # Perform of upload of artfiacts for GoLang
    - name: Upload Artifacts to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifacts_name }}
        path: |
          ${{ inputs.source_path }}/bin/**
          ${{ steps.globs.outputs.includes }}
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast
        overwrite: 'true'

    # Perform of upload of sources
    - name: Upload Sources to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}
        path: |
          ${{ inputs.source_path }}/**
          !${{ inputs.source_path }}/bin/**
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '3' #mid-fast

    # Perform of upload of target generated sources
    - name: Upload Sources to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}_target
        path: |
          ${{ inputs.source_path }}/test-results/**
          ${{ inputs.source_path }}/**/bin/**
          ${{ inputs.source_path }}/**/obj/**
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '3' #mid-fast
