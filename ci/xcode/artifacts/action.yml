name: Save Xcode Artifacts
author: cloudopsworks
description: Save Xcode artifacts to the artifacts store
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  artifacts_name:
    description: 'The name of the artifacts to save'
    required: false
    default: 'build_artifacts'
  sources_artifacts_name:
    description: 'The name of the sources to save'
    required: false
    default: 'source_artifacts'
  xcode_scheme:
    description: 'Xcode Scheme to build and test'
    required: true
  xcode_sdk:
    description: 'Xcode SDK to build and test'
    required: true
  xcode_destination:
    description: 'Xcode Destination to build and test'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Normalize xcode inputs
      id: xcode_normalized
      shell: bash
      env:
        INPUTS_XCODE_SCHEME: ${{ inputs.xcode_scheme }}
        INPUTS_XCODE_SDK: ${{ inputs.xcode_sdk }}
        INPUTS_XCODE_DESTINATION: ${{ inputs.xcode_destination }}
      run: |
        ret=$(echo "${INPUTS_XCODE_SCHEME}_${INPUTS_XCODE_SDK}_${INPUTS_XCODE_DESTINATION}" | tr ' ,:=/' '-')
        echo "result=$ret" >> $GITHUB_OUTPUT

    # Get Globs from configuration:
    - name: Get Globs
      id: globs
      uses: cloudopsworks/blueprints/common/artifacts/glob@5.10
      with:
        source_path: ${{ inputs.source_path }}
        blueprint_path: ${{ inputs.blueprint_path }}
        language: xcode

    # Perform of upload of artfiacts for xcode
    - name: Upload Artifacts to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifacts_name }}_${{ steps.xcode_normalized.outputs.result }}
        path: |
          ${{ steps.globs.outputs.includes }}
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '1' #fast
        overwrite: 'true'

    # Perform of upload of sources
    - name: Upload Sources to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}
        path: |
          ${{ inputs.source_path }}/**
          !${{ inputs.source_path }}/target/**
          !${{ inputs.source_path }}/build/**
          ${{ steps.globs.outputs.excludes }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '3' #mid-fast

    - name: Tar Artifacts target to preserve some configurations
      id: target_artifacts_tar
      working-directory: ${{ inputs.source_path }}/build
      shell: bash
      env:
        INPUTS_SOURCES_ARTIFACTS_NAME: ${{ inputs.sources_artifacts_name }}
      run: |
        tar -cf "$RUNNER_TEMP/${INPUTS_SOURCES_ARTIFACTS_NAME}_target.tar" ./
        echo "path=$RUNNER_TEMP/${INPUTS_SOURCES_ARTIFACTS_NAME}_target.tar" >> $GITHUB_OUTPUT

    # Perform of upload of all target artfiacts for Xcode
    - name: Upload Target Artifacts to workflow
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.sources_artifacts_name }}_target_${{ steps.xcode_normalized.outputs.result }}
        path: ${{ steps.target_artifacts_tar.outputs.path }}
        retention-days: 1
        include-hidden-files: true
        compression-level: '5' #good
        overwrite: 'true'
