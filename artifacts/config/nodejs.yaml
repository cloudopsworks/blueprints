# Default configuration for Node.js artifacts
zipGlobs:
  - ./**
  - .env
  - node_modules/**
excludeGlobs:
  - .cloudopsworks/*
  - .dockerignore
  - .git*
  - .git/
  - .helmignore
  - .nyc_output/*
  - .tronador
  - CODEOWNERS
  - Dockerfile
  - Makefile
  - OWNER*
  - README.md
  - apifiles/*
  - bom.xml
  - charts/*
  - cloudopsworks-ci*
  - coverage/*
  - gulpfile*
  - jenkins*
  - skafold*
  - target/*
  - tronador/*