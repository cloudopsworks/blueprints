# Default configuration for Xcode artifacts
zipGlobs:
  - "build/build_artifacts/*.ipa"
excludeGlobs:
  - .dockerignore
  - .git*
  - .git/
  - .helmignore
  - .tronador
  - CODEOWNERS
  - Dockerfile
  - Makefile
  - OWNER*
  - README.md
  - apifiles/*
  - charts/*
  - cloudopsworks-ci*
  - gulpfile*
  - jenkins*
  - skafold*
  - target/*
  - tronador/*