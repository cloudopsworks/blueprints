# Default configuration for Python artifacts
zipGlobs:
  - "*.py"
  - "*.pyc"
  - "*.pyo"
  - "app/**/*"
  - "pyproject.toml"
  - "requirements.txt"
excludeGlobs:
  - .Python
  - .coverage
  - .dockerignore
  - .env
  - .git*
  - .git/
  - .helmignore
  - .tronador
  - .venv
  - CODEOWNERS
  - Dockerfile
  - ENV
  - Makefile
  - OWNER*
  - README.md
  - apifiles/*
  - bom.xml
  - charts/*
  - cloudopsworks-ci*
  - coverage.xml
  - env/
  - htmlcov/*
  - jenkins*
  - poetry.lock
  - target/*
  - test-results.xml
  - tronador/*
  - venv/