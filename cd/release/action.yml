name: Release Workflow for Github
author: cloudopsworks
description: Release Workflow for Github
inputs:
  source_path:
    description: 'The path to the source code'
    value: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    value: 'bp'
  ref_name:
    description: 'The reference name'
    required: true
  release_tag:
    description: 'The release tag'
    required: true
  is_pre_release:
    description: 'The pre-release flag'
    required: false
    default: 'false'
  go_releaser_inuse:
    description: 'Whether goreleaser is in action or not, if true, the release will be created as draft, final publishing should be done by goreleaser, if false, the release will be published immediately'
    required: false
    default: 'false'
  files_globs:
    description: 'The files globs to include in the release'
    required: false
    default: |
        target/*.zip
        target/*.tgz
  token:
    description: 'The github token to use for the release'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Normalize version Tag
      id: normalize
      uses: actions/github-script@v8
      env:
        INPUTS_RELEASE_TAG: ${{ inputs.release_tag }}
      with:
        result-encoding: string
        script: |
          const relTag = '' + (process.env.INPUTS_RELEASE_TAG || '') + ''
          var release = relTag;
          if ( !relTag.startsWith('v') ) {
            release = 'v' + relTag; 
          }
          return release;

    # Changelog generation
    - name: Get previous tag
      working-directory: ${{ inputs.source_path }}
      id: previous_tag
      shell: bash
      env:
        STEPS_NORMALIZE_RESULT: ${{ steps.normalize.outputs.result }}
      run: |
        pwd
        name=$(git --no-pager tag --sort=creatordate --merged "${STEPS_NORMALIZE_RESULT}" | egrep "v[0-9]+\.[0-9]+\.[0-9]+$" | awk '{lines[NR]=$0} END{if(NR>1) print lines[NR-1]}')
        echo "previousTag: $name"
        echo "tag=$name" >> $GITHUB_OUTPUT

    - name: Changelog Generation
      uses: cloudopsworks/changelog-action@v1
      id: changelog
      if: ${{ steps.previous_tag.outputs.tag == '' }}
      with:
        token: ${{ inputs.token }}
        working_dir: ./${{ inputs.source_path }}/
        tag: ${{ steps.normalize.outputs.result }}
        writeToFile: true

    - name: Changelog Generation
      uses: cloudopsworks/changelog-action@v1
      id: changelog-from-to
      if: ${{ steps.previous_tag.outputs.tag != '' }}
      with:
        token: ${{ inputs.token }}
        working_dir: ./${{ inputs.source_path }}/
        fromTag: ${{ steps.normalize.outputs.result }}
        toTag: ${{ steps.previous_tag.outputs.tag }}
        writeToFile: true

    - name: Upload artifact to workflow run
      uses: actions/upload-artifact@v7
      with:
        name: changelog
        retention-days: 1
        overwrite: true
        path: ${{ inputs.source_path }}/CHANGELOG.md

    # Draft releases are not returned by getReleaseByTag (a draft holds no real tag yet),
    # so the full release list is paginated and matched on tag_name instead.
    - name: Check for existing Release
      id: existing_release
      uses: actions/github-script@v8
      env:
        STEPS_NORMALIZE_RESULT: ${{ steps.normalize.outputs.result }}
        INPUTS_GO_RELEASER_INUSE: ${{ inputs.go_releaser_inuse }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const releaseTag = '' + (process.env.STEPS_NORMALIZE_RESULT || '') + '';
          // goreleaser owns the draft, so drafts only count as an existing release when it is in use
          const scrubDrafts = ('' + (process.env.INPUTS_GO_RELEASER_INUSE || '') + '') === 'true';

          const releases = await github.paginate(github.rest.repos.listReleases, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });

          const tagged = releases.filter(release => release.tag_name === releaseTag);
          const existing = tagged.find(release => !release.draft || scrubDrafts);

          for (const release of tagged) {
            if (release.draft && !scrubDrafts) {
              core.warning(`Draft release '${releaseTag}' (id ${release.id}) is ignored because go_releaser_inuse is not 'true'`);
            }
          }

          if (existing) {
            console.log(`Release '${releaseTag}' already exists (id ${existing.id}, draft=${existing.draft}, prerelease=${existing.prerelease}), skipping creation`);
          } else {
            console.log(`No release found for '${releaseTag}' (drafts ${scrubDrafts ? 'included' : 'ignored'}), it will be created`);
          }

          core.setOutput('exists', existing ? 'true' : 'false');

    - name: Create Release
      if: ${{ steps.existing_release.outputs.exists != 'true' }}
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ inputs.token }}
        body: ${{ steps.changelog.outputs.changes != '' && steps.changelog.outputs.changes || steps.changelog-from-to.outputs.changes }}
        name: "${{ steps.normalize.outputs.result }}"
        tag_name: ${{ steps.normalize.outputs.result }}
        prerelease: ${{ inputs.is_pre_release }}
        draft: ${{ inputs.go_releaser_inuse == 'true' }}
        files: ${{ inputs.files_globs }}
