name: Git-Ops Slash Commands Processing
author: cloudopsworks
description: Process Git-Ops Slash Commands
inputs:
  component_mode:
    description: Authenticate schema-v2 PR commands with the trusted local runtime
    default: 'false'
    required: false
  token:
    description: 'The GitHub token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Authenticated component command
      if: ${{ inputs.component_mode == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: python3 bp/cd/monorepo/runtime/gitops.py command
    - name: Slash Command Dispatch
      if: ${{ inputs.component_mode != 'true' && !github.event.issue.pull_request }}
      uses: peter-evans/slash-command-dispatch@v5
      with:
        token: ${{ inputs.token }}
        commands: |
          deploy
          promote
          rebuild
          cleanup
          cleanup-previews
          release
          release-latest
          smoke-test
          retry
          help
        static-args: |
          author=${{ github.actor }}
          issue_number=${{ github.event.issue.number }}
          issue_repository=${{ github.repository }}

    - name: Slash Command Dispatch Pull-Request
      if: ${{ inputs.component_mode != 'true' && github.event.issue.pull_request }}
      uses: peter-evans/slash-command-dispatch@v5
      with:
        token: ${{ inputs.token }}
        commands: |
          approved
          approve
          lgtm
          cancel
          retry
          help
        static-args: |
          author=${{ github.actor }}
          pull_request=true
          pull_request_number=${{ github.event.issue.number }}

