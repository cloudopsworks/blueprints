name: Xray Observability deployment setup for HELM
author: cloudopsworks
description: Xray Observability deployment setup for HELM chart
inputs:
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  cloud:
    description: 'The cloud'
    required: true
  release_name:
    description: 'The release name'
    required: true
  release_version:
    description: 'The release version'
    required: true
  project_key:
    description: 'The package name'
    required: true
  deployment_name:
    description: 'The deployment name'
    required: true
  environment:
    description: 'The environment'
    required: true
  front_end:
    description: 'Deployment is a front end'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Xray variable Injection
      working-directory: ${{ inputs.blueprint_path }}/terraform/aws/kubernetes
      id: xray_inject
      shell: bash
      env:
        INPUTS_RELEASE_NAME: ${{ inputs.release_name }}
        INPUTS_RELEASE_VERSION: ${{ inputs.release_version }}
        INPUTS_ENVIRONMENT: ${{ inputs.environment }}
        INPUTS_PROJECT_KEY: ${{ inputs.project_key }}
        INPUTS_FRONT_END: ${{ inputs.front_end }}
      run: |
        echo "::group::Xray variable Injection"
        CLUSTER_NAME=$(yq e '.cluster_name' inputs.yaml)
        NAMESPACE=$(yq e '.namespace' inputs.yaml)
        OTEL_EXTRA=""
        if [[ "${INPUTS_FRONT_END}" == "true" ]]; then
          OTEL_EXTRA=",deployment.environment=eks:${CLUSTER_NAME}/${NAMESPACE}"
        fi
        OTEL_RESOURCE_ATTRIBUTES="service.name=${INPUTS_RELEASE_NAME},service.version=${INPUTS_RELEASE_VERSION},service.env=${INPUTS_ENVIRONMENT},service.sourceProject=${INPUTS_PROJECT_KEY}${OTEL_EXTRA}" \
        yq e -i ".env += [{\"name\":\"OTEL_RESOURCE_ATTRIBUTES\",\"value\":strenv(OTEL_RESOURCE_ATTRIBUTES)}]" helm-values.yaml
        echo "::endgroup::"
