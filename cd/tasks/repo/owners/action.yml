name: Process Owners action
author: cloudopsworks
description: Process Owners (cloudopsworks-ci.yaml) and configure pipeline/repository
inputs:
  component_mode:
    description: Use typed protected policy and reviewed local helpers
    required: false
    default: 'false'
  source_path:
    description: 'The path to the source code'
    required: false
    default: 'source'
  blueprint_path:
    description: 'The path to the blueprint'
    required: false
    default: 'bp'
  token:
    description: 'The GitHub token'
    required: true
  bot_user:
    description: 'The bot user to use for the build'
    required: true
  bot_email:
    description: 'The bot email to use for the build'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate trusted component owner policy before mutations
      id: component_policy
      if: ${{ inputs.component_mode == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: python3 bp/cd/monorepo/runtime/owners.py preflight
    - name: Component collaborators and teams
      if: ${{ inputs.component_mode == 'true' }}
      uses: ./bp/cd/tasks/repo/owners/contributors
      with:
        token: ${{ inputs.token }}
        contrib_list: ${{ steps.component_policy.outputs.contributors }}
    - name: Component branch protections
      if: ${{ inputs.component_mode == 'true' }}
      uses: ./bp/cd/tasks/repo/owners/protect/gitflow
      with:
        component_mode: 'true'
        token: ${{ inputs.token }}
        reviewers_list: ${{ steps.component_policy.outputs.reviewers }}
        owners_list: ${{ steps.component_policy.outputs.owners }}
        contrib_list: ${{ steps.component_policy.outputs.contributors }}
        reviewers_count: ${{ steps.component_policy.outputs.requiredReviewers }}
        repo_type: sourcecode
    - name: Component commit protection
      if: ${{ inputs.component_mode == 'true' && steps.component_policy.outputs.conventionalCommitsEnabled == 'true' }}
      uses: ./bp/cd/tasks/repo/owners/protect/commits
      with:
        component_mode: 'true'
        token: ${{ inputs.token }}
        reviewers_list: ${{ steps.component_policy.outputs.reviewers }}
        owners_list: ${{ steps.component_policy.outputs.owners }}
        contrib_list: ${{ steps.component_policy.outputs.contributors }}
        reviewers_count: ${{ steps.component_policy.outputs.requiredReviewers }}
        repo_type: sourcecode
        enforce_conventional_commits: ${{ steps.component_policy.outputs.enforceConventionalCommits }}
        custom_commits_pattern: ${{ steps.component_policy.outputs.enforceCustomCommitsPattern }}
        custom_commits_pattern_regex: ${{ steps.component_policy.outputs.enforceCustomCommitsPatternRegex }}
    - name: Component source protection
      if: ${{ inputs.component_mode == 'true' }}
      uses: ./bp/cd/tasks/repo/owners/protect/sources
      with:
        component_mode: 'true'
        token: ${{ inputs.token }}
        protected_sources: ${{ steps.component_policy.outputs.protectedSources }}
        reviewers_list: ${{ steps.component_policy.outputs.reviewers }}
        owners_list: ${{ steps.component_policy.outputs.owners }}
    - name: Component canonical protected environments
      if: ${{ inputs.component_mode == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: python3 bp/cd/monorepo/runtime/owners.py environments
    - name: Retrieve branch protection rule
      if: ${{ inputs.component_mode != 'true' }}
      id: branch_protection_rules
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".config.branchProtection and true" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> ${GITHUB_OUTPUT}

    - name: Retrieve Conventional Commits ruleset
      if: ${{ inputs.component_mode != 'true' }}
      id: conventional_commits
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".config.conventionalCommitsEnabled and true" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> $GITHUB_OUTPUT

    - name: Retrieve Conventional Commits enforcement
      if: ${{ inputs.component_mode != 'true' }}
      id: enforce_conventional_commits
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".config.enforceConventionalCommits and true" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> $GITHUB_OUTPUT

    - name: Retrieve Custom Commits Pattern Enforcement
      if: ${{ inputs.component_mode != 'true' }}
      id: custom_commits_pattern
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".config.enforceCustomCommitsPattern and true" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> $GITHUB_OUTPUT

    - name: Retrieve Custom Commits Enforcement Pattern
      if: ${{ inputs.component_mode != 'true' }}
      id: custom_commits_pattern_regex
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".config.enforceCustomCommitsPatternRegex" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> $GITHUB_OUTPUT

    - name: Retrieve protected sources
      if: ${{ inputs.component_mode != 'true' }}
      id: protected_sources
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq -o=json -I=0 ".config.protectedSources" .cloudopsworks/cloudopsworks-ci.yaml)
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Check if automatic
      if: ${{ inputs.component_mode != 'true' }}
      id: check_automatic
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".cd.automatic and true" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> $GITHUB_OUTPUT

    - name: Reviewers Count
      id: reviewers_count
      if: ${{ inputs.component_mode != 'true' && (steps.check_automatic.outputs.result == 'true' || steps.branch_protection_rules.outputs.result == 'true') }}
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq e ".config.requiredReviewers" .cloudopsworks/cloudopsworks-ci.yaml)
        echo "result=${RET}" >> $GITHUB_OUTPUT

    - name: Reviewers list as JSON
      id: reviewers_list
      if: ${{ inputs.component_mode != 'true' && (steps.check_automatic.outputs.result == 'true' || steps.branch_protection_rules.outputs.result == 'true') }}
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq -o=json -I=0 ".config.reviewers" .cloudopsworks/cloudopsworks-ci.yaml)
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Owners list as JSON
      id: owners_list
      if: ${{ inputs.component_mode != 'true' && (steps.check_automatic.outputs.result == 'true' || steps.branch_protection_rules.outputs.result == 'true') }}
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq -o=json -I=0 ".config.owners" .cloudopsworks/cloudopsworks-ci.yaml)
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Contributors list as JSON
      if: ${{ inputs.component_mode != 'true' }}
      id: contrib_list
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq -o=json -I=0 ".config.contributors" .cloudopsworks/cloudopsworks-ci.yaml)
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Deployments JSON
      if: ${{ inputs.component_mode != 'true' }}
      id: deployments_json
      shell: bash
      working-directory: ${{ inputs.source_path }}
      run: |
        RET=$(yq -o=json -I=0 ".cd.deployments" .cloudopsworks/cloudopsworks-ci.yaml)
        {
          echo "result<<EOF"
          echo "${RET}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Get repository type
      if: ${{ inputs.component_mode != 'true' }}
      id: repo_type
      working-directory: ${{ inputs.source_path }}
      shell: bash
      run: |
        if [ -f .cloudopsworks/.iac ]; then
          echo "result=iac" >> $GITHUB_OUTPUT
        elif [ -f .cloudopsworks/.docker ]; then
          echo "result=dockeronly" >> $GITHUB_OUTPUT
        else
          echo "result=sourcecode" >> $GITHUB_OUTPUT
        fi

    - name: Contributor list form JSON
      if: ${{ inputs.component_mode != 'true' }}
      uses: cloudopsworks/blueprints/cd/tasks/repo/owners/contributors@v5.10
      with:
        token: ${{ inputs.token }}
        contrib_list: ${{ steps.contrib_list.outputs.result }}

    - name: Advanced Protection on GitFlow
      if: ${{ inputs.component_mode != 'true' && steps.branch_protection_rules.outputs.result == 'true' }}
      uses: cloudopsworks/blueprints/cd/tasks/repo/owners/protect/gitflow@v5.10
      with:
        token: ${{ inputs.token }}
        reviewers_list: ${{ steps.reviewers_list.outputs.result }}
        owners_list: ${{ steps.owners_list.outputs.result }}
        contrib_list: ${{ steps.contrib_list.outputs.result }}
        reviewers_count: ${{ steps.reviewers_count.outputs.result }}
        repo_type: ${{ steps.repo_type.outputs.result }}

    - name: Rulesets for Conventional commits
      if: ${{ inputs.component_mode != 'true' && steps.branch_protection_rules.outputs.result == 'true' && steps.conventional_commits.outputs.result == 'true' }}
      uses: cloudopsworks/blueprints/cd/tasks/repo/owners/protect/commits@v5.10
      with:
        token: ${{ inputs.token }}
        reviewers_list: ${{ steps.reviewers_list.outputs.result }}
        owners_list: ${{ steps.owners_list.outputs.result }}
        contrib_list: ${{ steps.contrib_list.outputs.result }}
        reviewers_count: ${{ steps.reviewers_count.outputs.result }}
        repo_type: ${{ steps.repo_type.outputs.result }}
        enforce_conventional_commits: ${{ steps.enforce_conventional_commits.outputs.result }}
        custom_commits_pattern: ${{ steps.custom_commits_pattern.outputs.result }}
        custom_commits_pattern_regex: ${{ steps.custom_commits_pattern_regex.outputs.result }}


    # Push rulesets (FILE_PATH_RESTRICTION) are not supported on public repositories,
    # the visibility is resolved from the API so it does not depend on the triggering event payload.
    - name: Check repository visibility
      id: repo_visibility
      if: ${{ inputs.component_mode != 'true' && steps.branch_protection_rules.outputs.result == 'true' }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { data } = await github.rest.repos.get({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          console.log(`Repository ${context.repo.owner}/${context.repo.repo} visibility: ${data.visibility}`);
          core.setOutput('is_public', data.private ? 'false' : 'true');

    - name: Rulesets for Protected Sources
      if: ${{ inputs.component_mode != 'true' && steps.branch_protection_rules.outputs.result == 'true'
        && steps.repo_visibility.outputs.is_public != 'true'
        && steps.protected_sources.outputs.result != ''
        && steps.protected_sources.outputs.result != 'null' }}
      uses: cloudopsworks/blueprints/cd/tasks/repo/owners/protect/sources@v5.10
      with:
        token: ${{ inputs.token }}
        protected_sources: ${{ steps.protected_sources.outputs.result }}
        reviewers_list: ${{ steps.reviewers_list.outputs.result }}
        owners_list: ${{ steps.owners_list.outputs.result }}

    - name: Advanced Deployment Environments Creation
      if: ${{ inputs.component_mode != 'true' }}
      id: envs
      uses: cloudopsworks/blueprints/cd/tasks/repo/owners/envs@v5.10
      with:
        token: ${{ inputs.token }}
        reviewers_list: ${{ steps.reviewers_list.outputs.result }}
        deployments_json: ${{ steps.deployments_json.outputs.result }}
        source_path: ${{ inputs.source_path }}
