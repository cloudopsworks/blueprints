name: Rulesets for Conventional commits
author: cloudopsworks
description: 'This action will create or update a ruleset for Conventional Commits enforcement on the repository'
inputs:
  token:
    description: 'GitHub Token with repo and admin:org permissions'
    required: true
  reviewers_list:
    description: 'Reviewers list in JSON format'
    required: true
  owners_list:
    description: 'Owners list in JSON format'
    required: true
  contrib_list:
    description: 'Contributors list in JSON format'
    required: true
  reviewers_count:
    description: 'Reviewers count'
    required: true
  repo_type:
    description: 'Repository type'
    required: true
  enforce_conventional_commits:
    description: 'Enforce Conventional Commits'
    required: true
  custom_commits_pattern:
    description: 'Custom commits pattern'
    required: false
  custom_commits_pattern_regex:
    description: 'Custom commits pattern regex'
    required: false
runs:
  using: composite
  steps:
    - name: Rulesets for Conventional commits
      uses: actions/github-script@v9
      env:
        STEPS_REVIEWERS_LIST_RESULT: ${{ inputs.reviewers_list }}
        STEPS_OWNERS_LIST_RESULT: ${{ inputs.owners_list }}
        STEPS_CONTRIB_LIST_RESULT: ${{ inputs.contrib_list }}
        STEPS_REVIEWERS_COUNT_RESULT: ${{ inputs.reviewers_count }}
        STEPS_REPO_TYPE_RESULT: ${{ inputs.repo_type }}
        STEPS_ENFORCE_CONVENTIONAL_COMMITS_RESULT: ${{ inputs.enforce_conventional_commits }}
        STEPS_CUSTOM_COMMITS_PATTERN_RESULT: ${{ inputs.custom_commits_pattern }}
        STEPS_CUSTOM_COMMITS_PATTERN_REGEX_RESULT: ${{ inputs.custom_commits_pattern_regex }}
      with:
        github-token: '${{ inputs.token }}'
        script: |
          const conventionalCommitsEnforced = '' + (process.env.STEPS_ENFORCE_CONVENTIONAL_COMMITS_RESULT || '') + '' === 'true';
          const customCommitsPattern = '' + (process.env.STEPS_CUSTOM_COMMITS_PATTERN_RESULT || '') + '' === 'true';
          const customCommitsRegex = '' + (process.env.STEPS_CUSTOM_COMMITS_PATTERN_REGEX_RESULT || '') + '';
          const defaultConditionalCommitsRegexHead = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([a-zA-Z0-9_\\-]+\\))?: ';
          const defaultConditionalCommitsRegexTail = '.*'
          const rulesetName = 'commit-message-rules';
          const defaultOwners = JSON.parse('' + (process.env.STEPS_OWNERS_LIST_RESULT || '') + '');

          // Conventional Commits Enforcement through GitHub Branch Rulesets
          // As Rulesets are available on certain org/owner types, this action can fail if the owner type is not supported.
          // No additional checks will be done.
          // If ruleset exists and if not create it, if exists update it.
          // Conventional Commits and Custom Commits Enforcement are REGEX will be done through a single ruleset called "commit-message-rules" and will be applied to all branches
          // conventionalCommitsEnforced set rueleset enforcement to ENABLED if true or EVALUATE if false
          // customCommitsPattern if true adds an additional regex condition to the ruleset, if false only conventional commits regex will be used.
          
          // defaultOwners are granted ALWAYS bypass on this ruleset. Entries may be an
          // "<org>/<team>" slug, a user login, or one of the special keywords
          // "organizationAdmin", "enterpriseOwner" or "enterpriseRole" (matching the
          // corresponding boolean fields on RepositoryRulesetBypassActorInput), which skip
          // the team/user lookup entirely.
          const teamsQuery = `
            query($login: String!) {
              organization(login: $login) {
                teams(first: 100) {
                  nodes {
                    id
                    name
                    slug
                  }
                }
              }
            }
          `;
          const teamsResult = await github.graphql(teamsQuery, {login: context.repo.owner});

          const membersQuery = `
            query($login: String!) {
              organization(login: $login) {
                membersWithRole(first: 100) {
                  nodes {
                    login
                    id
                  }
                }
              }
            }
          `;
          const membersResult = await github.graphql(membersQuery, {login: context.repo.owner});

          const specialBypassActors = new Set(['organizationAdmin', 'enterpriseOwner', 'enterpriseRole']);

          function resolveBypassActors(actorNames, bypassMode) {
            const actors = [];
            for (const name of (actorNames || [])) {
              if (specialBypassActors.has(name)) {
                actors.push({[name]: true, bypassMode});
              } else if (name.includes('/')) {
                const teamSlug = name.split('/')[1];
                const team = teamsResult.organization.teams.nodes.find(t => t.slug === teamSlug);
                if (team) {
                  actors.push({actorId: team.id, bypassMode});
                }
              } else {
                const member = membersResult.organization.membersWithRole.nodes.find(m => m.login === name);
                if (member) {
                  actors.push({actorId: member.id, bypassMode});
                }
              }
            }
            return actors;
          }

          // Ruleset action
          const rulesetQuery = `
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                id
                rulesets(first: 100, targets: [BRANCH]) {
                  nodes {
                    id
                    name
                  }
                }
              }
            }
          `;
          const rulesetResult = await github.graphql(rulesetQuery, {owner: context.repo.owner, repo: context.repo.repo});
          const rulesetExists = rulesetResult.repository.rulesets.nodes.find((rule) => rule.name === rulesetName);
          const rulesetEnforcement = conventionalCommitsEnforced ? 'ACTIVE' : 'EVALUATE';
          var commitsRegex = defaultConditionalCommitsRegexHead;
          if (customCommitsPattern) {
              commitsRegex += customCommitsRegex
          }
          commitsRegex += defaultConditionalCommitsRegexTail;
          const inputBase = {
            name: rulesetName,
            target: 'BRANCH',
            enforcement: rulesetEnforcement,
            conditions: {
              refName: {
                include: ['~ALL'],
                exclude: []
              }
            },
            bypassActors: resolveBypassActors(defaultOwners, 'ALWAYS'),
            rules: [{
                type: 'COMMIT_MESSAGE_PATTERN',
                parameters: {
                    commitMessagePattern: {
                        name: 'Commits Regex Condition',
                        operator: 'regex',
                        pattern: commitsRegex,
                        negate: false
                    }
                }
            }]
          };
          
          console.log('inputBase: ' + JSON.stringify(inputBase));
          if (rulesetExists) {
            console.log('Ruleset exists, updating it... Id: ' + rulesetExists.id);
            const updateMutation = `
              mutation($input: UpdateRepositoryRulesetInput!) {
                updateRepositoryRuleset(input: $input) {
                  ruleset {
                    id
                    name
                    enforcement
                  }
                }
              }
            `;
            await github.graphql(updateMutation, {
              input: {
                repositoryRulesetId: rulesetExists.id,
                ...inputBase
              }
            });
          } else {
            console.log('Ruleset does not exist, creating it...');
            const createMutation = `
              mutation($input: CreateRepositoryRulesetInput!) {
                createRepositoryRuleset(input: $input) {
                  ruleset {
                    id
                    name
                    enforcement
                  }
                }
              }
            `;
            await github.graphql(createMutation, {
              input: {
                sourceId: rulesetResult.repository.id,
                ...inputBase
              }
            });
          }
