          if (process.env.ORIGIN) for (const [key,value] of Object.entries(facts)) if (JSON.parse(process.env.ORIGIN)[key] !== value) throw new Error('normal-context-origin-binding');
          identity['trusted-source'] = process.env.TRUSTED;
          identity['origin-facts'] = JSON.stringify(facts);
          for (const [key,value] of Object.entries(identity)) core.setOutput(key,value);
    - id: policy
      if: steps.verify.outputs.closure == 'true'
      uses: ./bp/ci/monorepo/source
      with:
        source-sha: ${{ steps.verify.outputs.policy-sha }}
    - id: lifecycle
      if: steps.verify.outputs.closure == 'true'
      uses: actions/github-script@v9
      env:
        DIRECTORY: ${{ steps.policy.outputs.directory }}
        HOST_REF: ${{ steps.verify.outputs.host-ref }}
        BASE_REF: ${{ steps.verify.outputs.base-ref }}
      with:
        script: |
          const env = process.env;
          const output = await exec.getExecOutput('tronador', ['components', 'lifecycle', '--config-only', '--workdir', env.DIRECTORY, '--event', 'pull_request_closed', '--ref', env.HOST_REF, '--base-ref', env.BASE_REF, '--json'], {silent: true, ignoreReturnCode: true});
          if (output.exitCode !== 0 || Buffer.byteLength(output.stdout) > 65536) throw new Error('context-lifecycle');
          const result = JSON.parse(output.stdout);
          const fields = ['eligible', 'reason', 'refClass', 'environment', 'deploymentEnabled', 'isRelease', 'isPreRelease', 'hasQualifier', 'targetName', 'deploymentName', 'protectedEnvironment'];
          if (Object.keys(result).sort().join() !== fields.sort().join() || typeof result.eligible !== 'boolean') throw new Error('context-lifecycle-output');
          core.setOutput('eligible', String(result.eligible));
          core.setOutput('lifecycle', JSON.stringify(result));
