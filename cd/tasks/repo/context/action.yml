          const facts = {event: run.event, ref: hostRef, hostSha: native.hostSha, callerPath: caller, callerSha: native.callerSha, blueprintSha: object.sha,
            sourceSha: source, sourceRef, sourceRepositoryId, trustedSource, prNumber: String(number), headRepositoryId: pull ? String(pull.head.repo.id) : '',
            headSha: pull?.head.sha || '', headRef: pull?.head.ref || '', baseRef, policySha: policy, closed: pull?.state === 'closed', merged: pull?.merged === true};
