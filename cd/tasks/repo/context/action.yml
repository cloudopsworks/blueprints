          for (const [key, value] of Object.entries({'source-ref': sourceRef, 'source-repository-id': sourceRepositoryId, 'trusted-source': String(trustedSource), 'delivery-check-id': origin?.checkId || '', 'delivery-check-name': origin?.checkName || '', 'source-sha': source, 'blueprint-sha': object.sha, 'caller-mode': 'normal-' + definition.kind, 'run-id': runId, 'run-attempt': attempt, 'host-ref': hostRef, 'base-ref': baseRef, 'pr-number': String(number), 'closure': String(definition.kind === 'closure'), 'policy-sha': policy})) core.setOutput(key, value);
    - id: protected
      if: inputs.mode == 'normal' || inputs.mode == 'delivery'
      uses: ./bp/cd/tasks/repo/context/protected-source
