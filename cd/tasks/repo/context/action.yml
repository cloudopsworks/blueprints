              for (const side of ['base', 'head']) if (!sha(association[side]?.sha) || typeof association[side]?.ref !== 'string' || !association[side].ref || !numeric(String(association[side]?.repo?.id))) throw new Error('normal-context-pull-association');
              number = association.number;
            } else if (historical) number = Number(origin.prNumber);
            else {
              const event = context.payload?.pull_request;
              if (context.payload?.action !== 'closed' || event?.state !== 'closed' || event.merged !== true || !Number.isSafeInteger(event.number) || event.number < 1 || !sha(event.base?.sha)) throw new Error('normal-context-closure-event');
              number = event.number;
              policy = event.base.sha;
            }
            pull = (await github.rest.pulls.get({...context.repo, pull_number: number})).data;
            if (pull.number !== number || String(pull.base?.repo?.id) !== env.GITHUB_REPOSITORY_ID || !sha(pull.head?.sha) || typeof pull.base?.ref !== 'string') throw new Error('normal-context-pull');
            if (association && (association.base.ref !== pull.base.ref || association.head.ref !== pull.head?.ref || association.head.sha !== pull.head.sha || String(association.base.repo.id) !== env.GITHUB_REPOSITORY_ID || String(association.head.repo.id) !== String(pull.head?.repo?.id))) throw new Error('normal-context-pull-association');
            baseRef = pull.base.ref;
            if (definition.kind === 'closure') {
              if (!historical && run.head_branch !== repository.default_branch || pull.state !== 'closed' || pull.merged !== true || !sha(pull.merge_commit_sha)) throw new Error('normal-context-closure');
              if (!historical) {
                const event = context.payload.pull_request;
                if (event.merge_commit_sha !== pull.merge_commit_sha || event.base.ref !== baseRef || String(event.base.repo?.id) !== env.GITHUB_REPOSITORY_ID || event.head?.sha !== pull.head.sha || String(event.head?.repo?.id) !== String(pull.head?.repo?.id)) throw new Error('normal-context-closure-source');
              }
              if (native.ref !== 'refs/heads/' + run.head_branch) throw new Error('normal-context-native-ref');
              source = pull.merge_commit_sha;
            } else {
              if (native.ref !== `refs/pull/${number}/merge`) throw new Error('normal-context-native-ref');
              if (run.head_sha !== pull.head.sha) throw new Error('normal-context-pr-source');
              if (!historical && (!sha(policy) || context.payload?.pull_request?.number !== number || context.payload.pull_request.head?.sha !== source || String(context.payload.pull_request.head?.repo?.id) !== String(pull.head?.repo?.id) || String(context.payload.pull_request.base?.repo?.id) !== env.GITHUB_REPOSITORY_ID)) throw new Error('normal-context-pr-event');
