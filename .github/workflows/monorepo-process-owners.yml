name: Monorepo process-owners
on:
  workflow_call:
    secrets:
      BOT_TOKEN:
        required: true
      BOT_TOKEN_SCOPED:
        required: true
permissions: {}
concurrency:
  group: monorepo-process-owners-${{ github.repository }}-${{ github.event.issue.number || github.event.client_payload.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  process-owners:
    name: Monorepo process-owners
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      packages: write
      statuses: write
    steps:
      - uses: cloudopsworks/blueprints/cd/checkout@v5.11.0
        with:
          checkout_source: 'false'
          persist_credentials: 'false'
          check_module_version: 'false'
          blueprint_ref: v5.11.0
      - uses: cloudopsworks/install-tronador-cli@v1
        with:
          version: v0.6.0
      - uses: ./bp/cd/tasks/repo/owners
        env:
          GH_POLICY_TOKEN: ${{ secrets.BOT_TOKEN_SCOPED }}
        with:
          component_mode: 'true'
          token: ${{ secrets.BOT_TOKEN }}
          bot_user: ${{ vars.BOT_USER }}
          bot_email: ${{ vars.BOT_EMAIL }}
