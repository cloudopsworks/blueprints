          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          origin-run-id: ${{ inputs.run-id }}
          origin-run-attempt: ${{ inputs.run-attempt }}
          plan-artifact-id: ${{ inputs.plan-artifact-id }}
          plan-archive-digest: ${{ inputs.plan-archive-digest }}
