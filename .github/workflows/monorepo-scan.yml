              if (!item.artifactName?.startsWith(prefix) || names.has(item.artifactName)) throw new Error('scan-receipt-artifact');
              const key = item.artifactName.slice(prefix.length), file = env['COMPUTED_' + key.replaceAll('-', '_').toUpperCase()];
              if (!file) throw new Error('scan-receipt-unexpected');
              const computed = await validate('ScannerResult', file), retrieved = await validate('ScannerResult', item.recordPath);
              if (computed.digest !== retrieved.digest || computed.record.componentId !== env.COMPONENT || computed.record.sourceSha !== original.record.headSha) throw new Error('scan-receipt-readback');
              names.add(item.artifactName);
              records.push({key, artifactId: item.artifactId, artifactName: item.artifactName, archiveDigest: item.archiveDigest, digest: computed.digest});
            }
            const owner = owners[0];
            const binding = {repositoryId: env.GITHUB_REPOSITORY_ID, runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT, originRunId: env.ORIGIN_RUN_ID, originRunAttempt: env.ORIGIN_RUN_ATTEMPT, planArtifactId: env.PLAN_ARTIFACT_ID, planArchiveDigest: env.PLAN_ARCHIVE_DIGEST, planDigest: current.digest, policyDigest, policyDigests: JSON.parse(env.POLICY_DIGESTS), componentId: env.COMPONENT, originalPlanDigest: original.digest, componentDigest: component.digest, sourceSha: original.record.headSha, mainDigest: component.record.mainArtifact.digest, mainFormat: component.record.mainArtifact.format, previewFormat: component.record.previewArtifact?.format || null, previewDigest: component.record.previewArtifact?.digest || null, owner: {runId: owner.runId, artifactId: owner.artifactId, artifactName: owner.artifactName, archiveDigest: owner.archiveDigest}, records};
