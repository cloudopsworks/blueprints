            if (!Array.isArray(owners) || owners.length !== 1 || !Array.isArray(scans) || scans.length < 5 || scans.length > 7 || component.record.componentId !== env.COMPONENT || component.record.headSha !== original.record.headSha || component.record.version !== original.record.version) throw new Error('scan-receipt-owner');
            const names = new Set(), records = [];
