name: Monorepo pull-request build
on:
  workflow_call:
permissions: {}
jobs:
  prepare:
    name: Prepare immutable source and one repository version
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ fromJSON(steps.lifecycle.outputs.lifecycle).eligible }}
      version: ${{ steps.prepare.outputs.version }}
      head: ${{ steps.prepare.outputs.head }}
      base: ${{ steps.prepare.outputs.base }}
      event: ${{ steps.prepare.outputs.event }}
      materialize-all: ${{ steps.prepare.outputs.materialize-all }}
    steps:
      - uses: cloudopsworks/blueprints/cd/checkout@v5.11.0
        with:
          source_path: .
          source_ref: ${{ github.event.pull_request.head.sha }}
          blueprint_path: bp
          blueprint_ref: v5.11.0
          persist_credentials: 'false'
          check_module_version: 'false'
      - uses: ./bp/ci/config/lifecycle
        id: lifecycle
        with:
          mode: schema-v2
          source_path: .
      - name: Freeze actual pull request source identity
        id: prepare
        if: fromJSON(steps.lifecycle.outputs.lifecycle).eligible
        uses: actions/github-script@v9
        with:
          script: |
            const captured = context.payload.pull_request;
            if (context.eventName !== 'pull_request' || !Number.isSafeInteger(captured?.number) || captured.number < 1 || String(captured.base?.repo?.id) !== process.env.GITHUB_REPOSITORY_ID || !/^[0-9a-f]{40}$/.test(captured.head?.sha || '')) throw new Error('pr-prepare-host');
            const current = (await github.rest.pulls.get({...context.repo, pull_number: captured.number})).data;
            if (current.number !== captured.number || current.head?.sha !== captured.head.sha || String(current.head?.repo?.id) !== String(captured.head?.repo?.id) || String(current.base?.repo?.id) !== process.env.GITHUB_REPOSITORY_ID) throw new Error('pr-prepare-source');
            const checkout = await exec.getExecOutput('git', ['rev-parse', 'HEAD'], {silent: true, ignoreReturnCode: true});
            if (checkout.exitCode !== 0 || checkout.stdout.trim() !== captured.head.sha) throw new Error('pr-prepare-checkout');
            core.setOutput('head', captured.head.sha);
            core.setOutput('base', '');
            // The exact real-Git CI plan job computes the single GitVersion version once.
            core.setOutput('version', '');
            core.setOutput('event', 'pull-request');
            core.setOutput('materialize-all', 'false');
  ci:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: read
    uses: ./.github/workflows/monorepo-ci.yml
    with:
      head-sha: ${{ needs.prepare.outputs.head }}
      base-sha: ${{ needs.prepare.outputs.base }}
      event: ${{ needs.prepare.outputs.event }}
      version: ${{ needs.prepare.outputs.version }}
      all: ${{ needs.prepare.outputs.materialize-all == 'true' }}
  stage:
    name: monorepo-stage-publisher
    needs: [prepare, ci]
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: cloudopsworks/blueprints/cd/checkout@v5.11.0
        with:
          checkout_source: 'false'
          blueprint_path: bp
          blueprint_ref: v5.11.0
          persist_credentials: 'false'
          check_module_version: 'false'
      - uses: ./bp/ci/monorepo/cli
      - name: Independently validate source YAML and immutable component bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ needs.ci.outputs.plan-artifact-id }}
          VERSION: ${{ needs.ci.outputs.version }}
          EVENT: ${{ needs.prepare.outputs.event }}
        run: python3 bp/cd/monorepo/runtime/stage_publisher.py assemble --plan-artifact-id "$PLAN_ID" --version "$VERSION" --event "$EVENT" --out stage-work
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: monorepo-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage-work/stage/
          if-no-files-found: error
          overwrite: false
      - name: Bind exact immutable artifact ID to this trusted publisher job
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARCHIVE_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python3 bp/cd/monorepo/runtime/stage_publisher.py marker --artifact-id "$ARTIFACT_ID" --digest "$ARCHIVE_DIGEST"
