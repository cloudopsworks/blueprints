name: Exact protected monorepo operation
on:
  workflow_call:
    inputs:
      operation: {type: string, required: true}
      environment: {type: string, required: true}
      target: {type: string, required: true}
      component: {type: string, required: true}
      qualifier: {type: string, default: ''}
      lock-id: {type: string, default: ''}
      confirmation: {type: string, default: ''}
    secrets:
      DEPLOYMENT_STATE_CONF: {required: false}
      CLOUDOPSWORKS_AUTH: {required: false}
      CLOUDOPSWORKS_PROBE_SECRETS: {required: false}
      CLOUDOPSWORKS_HOST_KEYS: {required: false}
permissions: {}
# One holder per nested call graph; same group as normal global preflight/apply.
concurrency:
  group: cloudopsworks-state-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  operation:
    if: inputs.operation == 'destroy' || inputs.operation == 'unlock'
    name: monorepo-operation-${{ inputs.target }}-${{ inputs.component }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: read
      packages: read
      id-token: write
    steps:
      - uses: cloudopsworks/blueprints/cd/checkout@v5.11.0
        with:
          checkout_source: 'false'
          blueprint_path: bp
          blueprint_ref: v5.11.0
          persist_credentials: 'false'
          check_module_version: 'false'
      - uses: ./bp/ci/monorepo/cli
      - id: context
        name: Select exact workload and frozen backend before either authentication
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
          LOCK_ID: ${{ inputs.lock-id }}
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_STATE_CONF: ${{ vars.DEPLOYMENT_STATE_CONF || secrets.DEPLOYMENT_STATE_CONF }}
          CLOUDOPSWORKS_AUTH: ${{ secrets.CLOUDOPSWORKS_AUTH }}
          CLOUDOPSWORKS_IDENTITIES: ${{ vars.CLOUDOPSWORKS_IDENTITIES }}
          CLOUDOPSWORKS_REGISTRIES: ${{ vars.CLOUDOPSWORKS_REGISTRIES }}
          CLOUDOPSWORKS_PROBE_SECRETS: ${{ secrets.CLOUDOPSWORKS_PROBE_SECRETS }}
          CLOUDOPSWORKS_HOST_KEYS: ${{ secrets.CLOUDOPSWORKS_HOST_KEYS }}
          TARGET: ${{ inputs.target }}
          COMPONENT: ${{ inputs.component }}
        run: python3 bp/cd/monorepo/runtime/operation_entry.py configure --operation "$OPERATION" --environment "$ENVIRONMENT" --target "$TARGET" --component "$COMPONENT" --confirmation "$CONFIRMATION" --lock-id "$LOCK_ID"
      - uses: ./bp/cd/monorepo/tools
        with:
          provider: ${{ steps.context.outputs.workload-provider }}
          kubectl-version: ${{ vars.CLOUDOPSWORKS_KUBECTL_VERSION || 'v1.37.2' }}
      - uses: ./bp/cd/monorepo/tools
        if: steps.context.outputs.backend-provider != steps.context.outputs.workload-provider
        with:
          provider: ${{ steps.context.outputs.backend-provider }}
      - uses: ./bp/cd/deploy/common/iac
        with:
          token: ${{ github.token }}
          tofu_version: '1.11.4'
          tg_version: '0.99.4'
      - uses: ./bp/cd/monorepo/auth
        id: workload
        with:
          provider: ${{ steps.context.outputs.workload-provider }}
          auth-ref: ${{ steps.context.outputs.workload-ref }}
          bindings: ${{ secrets.CLOUDOPSWORKS_AUTH }}
          install-tools: 'false'
          context-name: workload
      - uses: ./bp/cd/monorepo/auth
        id: backend
        if: steps.context.outputs.same-binding != 'true'
        with:
          provider: ${{ steps.context.outputs.backend-provider }}
          auth-ref: ${{ steps.context.outputs.backend-ref }}
          bindings: ${{ secrets.CLOUDOPSWORKS_AUTH }}
          install-tools: 'false'
          context-name: backend
      - name: Independently revalidate host, scans, pair, native ownership and exact operation
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
          LOCK_ID: ${{ inputs.lock-id }}
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_STATE_CONF: ${{ vars.DEPLOYMENT_STATE_CONF || secrets.DEPLOYMENT_STATE_CONF }}
          CLOUDOPSWORKS_AUTH: ${{ secrets.CLOUDOPSWORKS_AUTH }}
          CLOUDOPSWORKS_IDENTITIES: ${{ vars.CLOUDOPSWORKS_IDENTITIES }}
          CLOUDOPSWORKS_REGISTRIES: ${{ vars.CLOUDOPSWORKS_REGISTRIES }}
          CLOUDOPSWORKS_PROBE_SECRETS: ${{ secrets.CLOUDOPSWORKS_PROBE_SECRETS }}
          CLOUDOPSWORKS_HOST_KEYS: ${{ secrets.CLOUDOPSWORKS_HOST_KEYS }}
          TARGET: ${{ inputs.target }}
          COMPONENT: ${{ inputs.component }}
          WORKLOAD_CONTEXT: ${{ steps.workload.outputs.context-path }}
          BACKEND_CONTEXT: ${{ steps.backend.outputs.context-path }}
        run: python3 bp/cd/monorepo/runtime/operation_entry.py run --operation "$OPERATION" --environment "$ENVIRONMENT" --target "$TARGET" --component "$COMPONENT" --confirmation "$CONFIRMATION" --lock-id "$LOCK_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monorepo-operation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lifecycle-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: false
