# Historical workflow contracts captured from six unmodified sibling templates.
# Revisions and SHA-256 identify original source files; only events, job names, and guards are retained.
dotnet-app-template:
  revision: f959ee9d401ea2c980b4564ba866e96dbafd7785
  workflows:
    main-build.yml:
      sha256: d3a5e1e46850beae7c4fa807bfa3f64a67c274130b522021c8b3c6e8e7d79e2e
      contract:
        on:
          create: null
          push:
            tags:
              - v[0-9]+.[0-9]+.[0-9]+
              - v[0-9]+.[0-9]+.[0-9]+**
            branches:
              - develop
              - support/**
              - release/**
            paths:
              - '**'
              - .cloudopsworks/vars/**
              - .cloudopsworks/values/**
              - '!.github/**'
              - '!.cloudopsworks/*'
          workflow_dispatch: null
        jobs:
          code-build:
            if: |
              github.event_name == 'create' && 
              (startsWith(github.ref, 'refs/heads/support/') || startsWith(github.ref, 'refs/heads/release/')) ||
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          deploy-container:
            if: |
              (needs.code-build.outputs.container_enabled == 'true') &&
              (needs.code-build.outputs.deployment_enabled == 'true') &&
              (needs.code-build.outputs.is_library != 'true')
          release:
            if: |
              (! cancelled()) &&
              (needs.code-build.result == 'success') &&
              (needs.code-build.outputs.is_release == 'true') &&
              (needs.code-build.outputs.has_qualifier != 'true')
          scan:
            if: |
              (! cancelled()) && 
              (needs.code-build.result == 'success')
          deploy:
            if: |
              (! cancelled()) &&
              (needs.code-build.result == 'success') &&
              (needs.code-build.outputs.blue_green_enabled != 'true') && 
              (needs.code-build.outputs.deployment_enabled == 'true') && 
              (needs.code-build.outputs.is_library != 'true')
          deploy-blue-green:
            if: |
              (! cancelled()) &&
              (needs.code-build.result == 'success') &&
              (needs.code-build.outputs.blue_green_enabled == 'true')  && 
              (needs.code-build.outputs.deployment_enabled == 'true') && 
              (needs.code-build.outputs.is_library != 'true')
    pr-build.yml:
      sha256: f374337bcea87e31ed1961c19346254e6bc62efcbadd23637839c8789be6d7f1
      contract:
        on:
          pull_request:
            types:
              - opened
              - synchronize
              - edited
            branches:
              - hotfix/**
              - feature/**
              - master
              - release/**
              - support/**
              - develop
        jobs:
          check-pr: {}
          code-build:
            if: |
              (! startsWith(github.head_ref, 'release/')) &&
              (! startsWith(github.head_ref,'support/')) &&
              (! startsWith(github.head_ref,'master'))
          deploy-container:
            if: |
              (needs.code-build.outputs.container_enabled == 'true') &&
              (needs.code-build.outputs.deployment_enabled == 'true') &&
              (needs.code-build.outputs.is_library != 'true')
          preview:
            if: needs.code-build.outputs.has_preview == 'true'
          scan: {}
    pr-close.yaml:
      sha256: 6268a30ef71eaf2bb483d3c11f22c296ca46a06496f2f50eb931269e5a5b367a
      contract:
        on:
          pull_request:
            types:
              - closed
        jobs:
          preload: {}
          preview-destroy:
            if: needs.preload.outputs.has_preview == 'true'
          branch_deletion:
            if: ${{ ! cancelled() }}
    process-owners.yml:
      sha256: b66eb67181bf0191b43184debeced6c1d069a4c2584b2fffbac9cb4cad147d8c
      contract:
        on:
          push:
            branches:
              - master
              - main
              - develop
            paths:
              - OWNERS
              - .cloudopsworks/cloudopsworks-ci.yaml
              - .cloudopsworks/cloudopsworks-cd.yaml
          workflow_dispatch: null
        jobs:
          process-owners: {}
    environment-destroy.yml:
      sha256: 6b85d313e88cdd91c2361872b98877037306f0ed8ffa7ac855a42b923ac8a993
      contract:
        on:
          workflow_dispatch:
            inputs:
              destroyedDeploymentName:
                type: environment
                description: Select Environment to destroy
                required: true
              target:
                type: choice
                description: What to Destroy? API, Application Deployment or BOTH
                required: true
                default: BOTH
                options:
                  - app
                  - api
                  - BOTH
              qualifier:
                type: string
                description: Qualifier for the lock (green/bluee)
                required: false
                default: ""
        jobs:
          preload: {}
          destroy-environment: {}
    environment-unlock.yml:
      sha256: 4244a8ffe0757e74557a5c0f5555d676bd1b5923cfe4481c6096fd9c368450e3
      contract:
        on:
          workflow_dispatch:
            inputs:
              unlockDeploymentName:
                type: environment
                description: Select Environment to Unlock
                required: true
              target:
                type: choice
                description: What to Unlock? API or Application Deployment
                required: true
                default: app
                options:
                  - app
                  - api
              api_lock:
                type: string
                description: 'API to unlock (Format: API_Name/version)'
                required: false
                default: ""
              lockId:
                type: string
                description: Lock ID for the environment
                required: true
              qualifier:
                type: string
                description: Qualifier for the lock (green/bluee)
                required: false
                default: ""
        jobs:
          preload: {}
          unlock-environment: {}
